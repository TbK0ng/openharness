[project]
name = "openharness"
version = "0.3.0"
description = "OpenHarness agent framework — LangChain LLM client + Agent Loop tutorial replication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
]
keywords = ["agent", "langchain", "llm", "coding-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.scripts]
openharness = "openharness.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openharness"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
